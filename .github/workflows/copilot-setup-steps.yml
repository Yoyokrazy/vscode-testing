name: "Copilot Setup Steps"

# Minimal setup for this fork: Copilot Code Review only needs an ephemeral
# environment to run in — it clones the repo itself, so no dependency
# preinstall is required. Kept as a no-op on a GitHub-hosted runner (the
# upstream vscode-large-runners label does not exist on this fork).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: No-op
        run: echo "No preinstall needed; Copilot checks out the repo itself."
